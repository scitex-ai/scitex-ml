[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-ml"
version = "0.2.0"
description = "SciTeX ML — machine learning, classification, training utilities"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "noreply@scitex.ai" },
]
keywords = [
    "machine-learning",
    "deep-learning",
    "classification",
    "scikit-learn",
    "scitex",
    "science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps mirror the umbrella's [ai] extra (third-party) plus the
# standalone scitex packages we cross-import.
dependencies = [
    # Core scientific
    "numpy",
    "pandas",
    # `scipy` dropped from core in 2026-06-13 hard-dep-overreach sweep.
    # `rg "^(import|from)\s+scipy\b" src/` finds zero imports across
    # the 106 scitex_ml source files. If a future ml module needs it,
    # declare it as an extra (matches the scipy<1.17 already pinned in
    # the [project.optional-dependencies].docs block at line 133). See
    # scitex-dev a2a directive da6bcfb8 + lead's CI-as-gate guardrail
    # (a2a 582a39fb): if a lazy / re-export path needs scipy, CI
    # catches the regression before auto-merge.
    "matplotlib",
    "seaborn",
    "joblib",
    "natsort",
    "pyyaml",
    "ruamel.yaml",
    "requests",
    "Pillow",
    "xarray",
    "tqdm",
    "click>=8.0",
    # ML libraries
    "scikit-learn",
    "imbalanced-learn",
    "umap-learn",
    "sktime>=0.21.0",
    "markdown2",
    # SciTeX standalone deps (declared per
    # _skills/general/01_ecosystem_02_dependency-and-version-pinning.md).
    "scitex-logging>=0.1.3",
    "scitex-io>=0.2.0",
    "scitex-plt>=0.1.0",
    "scitex-repro>=0.1.3",
    "scitex-types>=0.1.3",
    "scitex-str>=0.1.11",
    "scitex-context>=0.1.0",
    # try_import_optional helper for gating the `[heavy]` torch / optuna /
    # catboost extras at import time.
    "scitex-dev>=0.11.7",
]

[project.optional-dependencies]
# Heavy / optional GPU and ML deps — gated behind _AVAILABLE flags in code.
heavy = [
    "torch",
    "torchvision",
    "torchaudio",
    "torchsummary",
    "pytorch_pretrained_vit",
    "optuna",
    "psutil",
    "catboost",
]
mcp = [
    "fastmcp>=2.0.0",
]
# SciTeX Voice V1 speaker-embedding path (ECAPA-TDNN via speechbrain).
# torch is pinned <=2.7 because 2.8+ dropped prebuilt Pascal (sm_60/61)
# wheels and compute-03/04 are GTX 1070 (Pascal); on those boxes use a
# cu12x wheel (CUDA 13 dropped offline Pascal support). See
# scitex_ml.inference._device and card
# scitex-voice-speaker-verified-dictation-v1-20260816.
voice = [
    "torch<=2.7",
    "torchaudio<=2.7",
    "speechbrain>=1.0",
]
seizure = [
    # Pulls in the standalone scitex-seizure-metrics library so that
    # `from scitex_ml.metrics import seizure` works and resolves to the
    # full evaluation surface (detection, forecasting, AlarmPolicy,
    # bridge, calibration, surrogates, plots, papers).
    "scitex-seizure-metrics>=0.1.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout",
    "ruff",
    "scitex-dev>=0.11.7",
    # PS210 [dev] extras completeness — every dep that lifted tests
    # import unguarded must live in [dev] so `pip install -e .[dev]`
    # actually runs the full suite.
    "psutil",
    "torch",
    "torchvision",
    "optuna",
    "pytorch_pretrained_vit",
    "scitex-seizure-metrics>=0.1.0",
    # Voice V1: speechbrain backs the ECAPA embedder that tests/scitex_ml/
    # embedding exercises, so [dev] must carry it for a full local run.
    "speechbrain>=1.0",
    # tests/scitex_ml/test__mcp_server.py imports the fastmcp-backed server.
    "fastmcp>=2.0.0",
    # Notebook execution for tests/examples/test_01_*.py (PS505).
    "nbconvert",
    "nbformat",
    "ipykernel",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
    # autosummary --recursive imports the source tree; skip mocked stubs by
    # installing the real heavy deps in CI docs builds.
    "torch",
    "torchvision",
    # scipy 1.17 ships a new distributions module whose `_combine_docs`
    # eagerly runs at import time and raises `ValueError: not enough values
    # to unpack (expected 2, got 1)` under sklearn-triggered import on
    # CPython 3.11/3.12/3.13. Pin scipy<1.17 for docs builds until the
    # upstream regression clears.
    "scipy<1.17",
]
all = [
    "scitex-ml[heavy]",
    "scitex-ml[mcp]",
    "scitex-ml[seizure]",
    "scitex-ml[voice]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-ml"
Repository = "https://github.com/ywatanabe1989/scitex-ml"
Documentation = "https://scitex-ml.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/scitex-ml/issues"

[project.scripts]
scitex-ml = "scitex_ml._cli:main"

[project.entry-points."scitex_dev.docs"]
scitex-ml = "scitex_ml"

[project.entry-points."scitex_dev.skills"]
scitex-ml = "scitex_ml"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_ml"]

# §6 MCP-parity is scoped via `audit.mcp-tools-allowlist` in
# .scitex/dev/config.yaml — scitex-ml exposes only the curated stateless
# analysis tools, checked against that declared set rather than the full
# Python API (training/optimizers stay Python-only).

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
# Subprocess coverage wiring (see scitex-dev skill leaf
# 05_development_06_subprocess-coverage.md). `parallel = true` makes
# every coverage process write to its own `.coverage.<host>.<pid>`
# file; `concurrency` covers both subprocess.run and threaded code.
# Without this, demo / nbconvert / subprocess.run child interpreters
# silently drop coverage data.
parallel = true
source = ["scitex_ml"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/scitex_ml/__init__.py" = ["E402", "F401"]
"src/scitex_ml/**/__init__.py" = ["F401"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]

[tool.scitex_dev.audit]
# PS-168 — Per-package secret + env-var prefix in GitHub Actions workflows.
# `GH_PERSONAL_ACCESS_TOKEN` is the ecosystem-wide cross-cutting PAT used
# by the contributor-assistant CLA action. The natural GITHUB_* namespace
# is reserved by GitHub Actions on the secret-name surface (HTTP 422 on
# every `gh secret set`), so the GH_ shorthand is the canonical
# substitute and is registered ecosystem-wide via PR #122 on scitex-dev
# (EXCEPTION_SECRETS_DEFAULT). This per-package entry pins the same
# exception inline so the audit passes on every scitex-dev version,
# independent of release timing.
ps168_secret_exceptions = ["GH_PERSONAL_ACCESS_TOKEN"]
