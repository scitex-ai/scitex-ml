[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scitex-ai"
version = "0.1.0"
description = "SciTeX AI — machine learning, classification, GenAI provider abstraction, training utilities"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai" },
]
keywords = [
    "ai",
    "machine-learning",
    "deep-learning",
    "classification",
    "genai",
    "llm",
    "openai",
    "anthropic",
    "scitex",
    "science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Runtime deps mirror the umbrella's [ai] extra (third-party) plus the
# standalone scitex packages we cross-import.
dependencies = [
    # Core scientific
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "joblib",
    "natsort",
    "pyyaml",
    "ruamel.yaml",
    "requests",
    "Pillow",
    "xarray",
    "tqdm",
    # ML libraries
    "scikit-learn",
    "imbalanced-learn",
    "umap-learn",
    "sktime>=0.21.0",
    "markdown2",
    # GenAI providers (kept in core because _gen_ai/ unconditionally imports
    # provider clients; the lazy GenAI top-level export defers actual use).
    "openai",
    "anthropic",
    "google-genai",
    "groq",
    # SciTeX standalone deps (declared per
    # _skills/general/01_ecosystem_02_dependency-and-version-pinning.md).
    "scitex-logging>=0.1.3",
    "scitex-io>=0.2.0",
    "scitex-plt>=0.1.0",
    "scitex-repro>=0.1.3",
    "scitex-types>=0.1.3",
]

[project.optional-dependencies]
# Heavy / optional GPU and ML deps — gated behind _AVAILABLE flags in code.
heavy = [
    "torch",
    "torchvision",
    "torchaudio",
    "torchsummary",
    "pytorch_pretrained_vit",
    "optuna",
    "psutil",
    "catboost",
]
mcp = [
    "fastmcp>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout",
    "ruff",
    "scitex-dev",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-ai[heavy]",
    "scitex-ai[mcp]",
]

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-ai"
Repository = "https://github.com/ywatanabe1989/scitex-ai"
Documentation = "https://scitex-ai.readthedocs.io"
Issues = "https://github.com/ywatanabe1989/scitex-ai/issues"

[project.entry-points."scitex_dev.docs"]
scitex-ai = "scitex_ai"

[project.entry-points."scitex_dev.skills"]
scitex-ai = "scitex_ai"

[tool.hatch.build.targets.wheel]
packages = ["src/scitex_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"src/scitex_ai/__init__.py" = ["E402", "F401"]
"src/scitex_ai/**/__init__.py" = ["F401"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples"]
