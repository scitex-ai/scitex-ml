name: CLA Assistant

# Reusable-workflow caller (scitex-ai/.github, 2026-07-10 fleet migration).
# Triggers/permissions preserved verbatim from the prior local file.
# Reusable workflow defaults (owner_login=ywatanabe1989,
# owner_allowlist="bot*,ywatanabe1989", default_branch=main) already match
# this repo's prior hardcoded values, so no `with:` overrides are needed.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  call:
    uses: scitex-ai/.github/.github/workflows/cla.yml@main
    # NAMED SECRET, not `secrets: inherit` (PS-224 §1). This caller fires
    # on `issue_comment` and `pull_request_target`, both of which an
    # UNAUTHENTICATED outsider can trigger on a public repo, so `inherit`
    # would forward EVERY secret this repository holds into a job a
    # stranger caused to run -- on whatever runner the callee targets.
    # Neither file shows that exposure alone: this caller names no
    # `runs-on`, so the destination lives in the callee.
    #
    # The callee declares exactly one secret --
    # `GH_PERSONAL_ACCESS_TOKEN: required: true` in
    # scitex-ai/.github/.github/workflows/cla.yml -- so passing that one
    # by name is complete, not a partial migration. `inherit` is not a
    # convenience here; it is the vulnerability.
    secrets:
      GH_PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
